<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<style>
  :root { --bg: #F4F3EF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; } }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
</style>
</head>
<body>
<iframe id="app" title="Budget" allow="clipboard-write"></iframe>
<script>
  // Coquille v3 : affiche le budget en plein écran dans un cadre quand le téléphone le permet,
  // sinon ouvre l'app normale. Le budget envoie « budget-pret » quand il est bien affiché (app commune v26).
  var APP = 'https://script.google.com/macros/s/AKfycbwe2K4BXdDEDY4ZTRaPoJpD7-Xg6Q8blUshssnu8D82pUsd2vMHM3X0zRsIadhJK6U/exec';
  var CLE = 'budget-cadre';            // 'ok' ou 'ko:<date>' : ce qui s'est passé la dernière fois sur ce téléphone
  var SEPT_JOURS = 7 * 24 * 3600 * 1000;
  function lire() { try { return localStorage.getItem(CLE) || ''; } catch (e) { return ''; } }
  function ecrire(v) { try { localStorage.setItem(CLE, v); } catch (e) {} }
  function appNormale() { location.replace(APP); }

  var avant = lire();
  var ko = /^ko:(\d+)$/.exec(avant);
  // Navigateurs qui bloquent la connexion Google dans un cadre (iPhone, Firefox) : app normale tout de suite
  var bloque = /iPhone|iPad|iPod|Firefox|FxiOS/.test(navigator.userAgent);

  if (bloque || (ko && Date.now() - Number(ko[1]) < SEPT_JOURS)) {
    appNormale();                      // le cadre n'a pas marché récemment ici : pas d'attente inutile
  } else {
    var pret = false;
    addEventListener('message', function (e) {
      var hote = '';
      try { hote = new URL(e.origin).hostname; } catch (err) {}
      if (e.data === 'budget-pret' && /\.googleusercontent\.com$/.test(hote)) { pret = true; ecrire('ok'); }
    });
    document.getElementById('app').src = APP;
    // Sans signal : app normale. On ne retient l'échec que si le cadre n'a jamais marché ici
    // (une fois qui a déjà marché, c'est sans doute le réseau : on réessaiera le cadre la prochaine fois).
    setTimeout(function () {
      if (pret) return;
      if (avant !== 'ok') ecrire('ko:' + Date.now());
      appNormale();
    }, avant === 'ok' ? 20000 : 10000);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=2').catch(function () {});
</script>
</body>
</html>
