<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Budget</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<style>
  :root { --bg: #F4F3EF; --ink: #1B1B1F; --muted: #6B6B73; --accent: #1E5B47; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --ink: #F2F1EE; --muted: #9A9AA3; --accent: #7FC8A9; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #secours { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: var(--bg); }
  #secours.visible { display: flex; }
  #secours p { margin: 0 0 16px; color: var(--muted); line-height: 1.45; }
  #secours a { display: inline-block; padding: 12px 20px; border-radius: 12px; background: var(--accent);
    color: var(--bg); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<iframe id="app" title="Budget" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbz1vrg15jd2WNOx2wkv5olaHliuyyaAbO9MZ5lwwxhhRqCw0BhE2hmvi4j3eM_e47M1/exec"></iframe>
<div id="secours">
  <div>
    <p>L'app met du temps à s'ouvrir.<br>Si ta connexion Google a expiré, reconnecte-toi une fois dans Chrome.</p>
    <a href="https://script.google.com/macros/s/AKfycbz1vrg15jd2WNOx2wkv5olaHliuyyaAbO9MZ5lwwxhhRqCw0BhE2hmvi4j3eM_e47M1/exec" target="_blank" rel="noopener">Ouvrir dans Chrome</a>
  </div>
</div>
<script>
  // Si le cadre ne se charge pas (connexion Google expirée, réseau), on propose d'ouvrir l'app dans Chrome.
  var charge = false;
  document.getElementById('app').addEventListener('load', function () { charge = true; });
  setTimeout(function () { if (!charge) document.getElementById('secours').classList.add('visible'); }, 20000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
